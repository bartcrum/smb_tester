[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "throughput"
version = "0.2.0"
description = "Throughput / performance benchmarking suite for file and network services"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Per-backend cloud SDKs (lazy-imported by the adapters; only needed at runtime
# for that backend, or at build time to bundle it into the Windows exe).
s3 = ["boto3"]
azure = ["azure-storage-blob"]
gcs = ["google-cloud-storage"]
kafka = ["confluent-kafka"]
cloud = ["boto3", "azure-storage-blob", "google-cloud-storage", "confluent-kafka"]
dev = ["pytest"]
# Everything PyInstaller needs to build the full "core + cloud" throughput.exe.
build = ["pyinstaller", "boto3", "azure-storage-blob", "google-cloud-storage", "confluent-kafka"]

[project.scripts]
throughput = "throughput.cli:main"

[tool.setuptools.packages.find]
include = ["throughput*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the default run binary-/backend-free: the live integration tier is
# deselected unless you opt in with `pytest -m integration`.
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a live backend (MinIO/S3, Kafka, ...); deselected by default",
]
